name: Metrics
on:
  # Schedule updates once a day at midnight
  schedule: [{cron: "0 0 * * *"}]
  # Lines below allow you to manually trigger it anytime from the Actions tab
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Master Metrics Generator
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Core configuration mimicking the reference image
          user: LakkhanaSudhamKalutara
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: UTC
          
          # Coding Habits plugin (Commits per hour/day charts)
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes

          # Languages plugin (The green bars & breakdown charts)
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Isometic Commit Calendar (The 3D green block calendar)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Mastered technologies plugin (The row of skill icons)
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_mode: icons
          plugin_topics_limit: 20
